<div class="dashboard-container">
    <!-- Cabeçalho -->
    <header class="dashboard-header">
      <div class="header-left">
        <img src="https://cartadeservicos.atibaia.sp.gov.br/assets/images/capsi_200x250-1298cbe99dcad84eea3e88a3b96d0cd7.png" alt="Logo CAPSI" class="logo" />
        <h1>CAPSI</h1>
      </div>
      <button class="logout-button" (click)="logout()">Sair</button>
    </header>
  
    <!-- Conteúdo principal -->
    <main class="dashboard-content">
      <div class="card" routerLink="/pacientes">
        <i class="fas fa-user-injured"></i>
        <h3>Pacientes</h3>
      </div>
  
      <div class="card" routerLink="/agendamentos">
        <i class="fas fa-calendar-check"></i>
        <h3>Agendamentos</h3>
      </div>
  
      <div class="card" routerLink="/equipe">
        <i class="fas fa-users"></i>
        <h3>Equipe</h3>
      </div>
  
      <div class="card" routerLink="/medicamentos">
        <i class="fas fa-pills"></i>
        <h3>Medicamentos</h3>
      </div>
  
      <div class="card" routerLink="/configuracoes">
        <i class="fas fa-cogs"></i>
        <h3>Configurações</h3>
      </div>
    </main>
  </div>
