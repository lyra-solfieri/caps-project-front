<header class="header">
  
  <div class="header-left">
    <a routerLink="/dashboard">
      <img src="logo-caps-original.png" alt="Logo CAPS" class="logo"/>
    </a>
  </div>

  <div class="header-right">

    <!-- BOTÃO PERFIL -->
    <div class="profile-container">
      <button class="profile-icon" (click)="toggleProfileMenu()">
        <span class="material-icons">account_circle</span>
      </button>

      <div class="profile-dropdown" *ngIf="isProfileMenuOpen">
        <a routerLink="/perfil" (click)="fecharDropdown()">Meu Perfil</a>
        <a *ngIf="isAdmin" routerLink="/register" (click)="fecharDropdown()">Gerenciar Equipe</a>
        <div class="dropdown-divider"></div>
        <button (click)="logout()">Sair</button>
      </div>
    </div>

    <!-- BOTÃO HAMBURGER -->
    <button class="hamburger-btn"
            [class.active]="isMenuOpen"
            (click)="toggleMenu()">

      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>

    </button>

  </div>

  <!-- MENU -->
  <nav class="nav-menu" [class.open]="isMenuOpen">

    <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Início</a>
    <a routerLink="/atendimento" routerLinkActive="active" (click)="closeMenu()">Atendimento</a>
    <a routerLink="/pacientes" routerLinkActive="active" (click)="closeMenu()">Pacientes</a>
    <a routerLink="/agendamentos" routerLinkActive="active" (click)="closeMenu()">Agendamentos</a>
    <a routerLink="/register" routerLinkActive="active" (click)="closeMenu()">Equipe</a>
    <a routerLink="/auditoria" routerLinkActive="active" (click)="closeMenu()" *ngIf="isAdmin">Auditoria</a>
    <a routerLink="/configuracoes" routerLinkActive="active" (click)="closeMenu()">Configurações</a>
    <a routerLink="/raas" routerLinkActive="active" (click)="closeMenu()">RAAS</a>
    <a routerLink="/anamnese-infantil" routerLinkActive="active" (click)="closeMenu()">Acolhimento</a>
    <a routerLink="/evolucao" routerLinkActive="active" (click)="closeMenu()">Evolução</a>
    <a routerLink="/relatorios" routerLinkActive="active" (click)="closeMenu()">Relatórios</a>
    <a routerLink="/login" (click)="logout()" class="logout-btn">Sair</a>


  </nav>

  <div class="overlay" *ngIf="isMenuOpen" (click)="closeMenu()"></div>

</header>
