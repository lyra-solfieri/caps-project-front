<app-header></app-header>
<div class="agendamento-container">
    <div class="agendamento-header">
      <h2>Agendamentos</h2>
       <div class="agendamento-actions">
        <button class="back-button" routerLink="/dashboard">Voltar ao Menu</button>
        <button class="add-button" (click)="addAgendamento()">+ Novo Agendamento</button>
      </div>
    </div>
  
    <table class="agendamento-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Paciente</th>
          <th>Profissional</th>
          <th>Data</th>
          <th>Hora</th>
          <th>Tipo</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let agendamento of agendamentos">
          <td>{{ agendamento.id }}</td>
          <td>{{ agendamento.paciente }}</td>
          <td>{{ agendamento.profissional }}</td>
          <td>{{ agendamento.data }}</td>
          <td>{{ agendamento.hora }}</td>
          <td>{{ agendamento.tipo }}</td>
          <td>
            <button class="edit" (click)="editarAgendamento(agendamento)">Editar</button>
            <button class="delete" (click)="excluirAgendamento(agendamento)">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <div *ngIf="agendamentos.length === 0" class="empty-message">
      Nenhum agendamento encontrado.
    </div>
  </div>
  <app-footer></app-footer>
