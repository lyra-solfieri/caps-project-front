<app-header></app-header>
<div class="cadastro-container">
  <h2>Cadastro de Agendamento</h2>
  
  <p class="required-legend">Os campos marcados com <span class="required">*</span> são obrigatórios.</p>

  <form #agendamentoForm="ngForm" (ngSubmit)="onSubmit()">

   
    <div class="form-section">
      <h3>Informações do Agendamento</h3>
      
      <div class="form-group">
        <label for="paciente">Paciente <span class="required">*</span></label>
        <input
          type="text"
          id="paciente"
          name="paciente"
          required
          [(ngModel)]="agendamento.paciente"
          placeholder="Nome do paciente"
        />
      </div>
  
      <div class="form-group">
        <label for="profissional">Profissional <span class="required">*</span></label>
        <input
          type="text"
          id="profissional"
          name="profissional"
          required
          [(ngModel)]="agendamento.profissional"
          placeholder="Nome do profissional"
        />
      </div>
    </div>

    <div class="form-section">
      <h3>Data e Hora</h3>

      <div class="form-group">
        <label for="data">Data <span class="required">*</span></label>
        <input
          type="date"
          id="data"
          name="data"
          required
          [(ngModel)]="agendamento.data"
        />
      </div>
  
      <div class="form-group">
        <label for="hora">Hora <span class="required">*</span></label>
        <input
          type="time"
          id="hora"
          name="hora"
          required
          [(ngModel)]="agendamento.hora"
        />
      </div>
    </div>

    <div class="form-section">
      <h3>Detalhes do Atendimento</h3>
      
      <div class="form-group">
        <label for="tipo">Tipo de Atendimento <span class="required">*</span></label>
        <input
          type="text"
          id="tipo"
          name="tipo"
          required
          [(ngModel)]="agendamento.tipo"
          placeholder="Ex: Psicologia, Enfermagem, Terapia"
        />
      </div>
    </div>
  
    <div class="buttons">
      <button type="submit" [disabled]="!agendamentoForm.form.valid">
        Salvar
      </button>
      <button type="button" class="cancel" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
<app-footer></app-footer>
