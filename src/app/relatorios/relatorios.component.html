<div class="relatorios-container">
  <div class="page-header">
    <div>
      <h2>Relatórios</h2>
      <p class="page-subtitle">Selecione um relatório para visualizar ou exportar dados do sistema</p>
    </div>
    <button class="back-button" routerLink="/dashboard">Voltar ao Menu</button>
  </div>

  <div class="cards-grid">
    <div
      class="relatorio-card"
      *ngFor="let card of cards"
      (click)="gerarRelatorio(card)"
    >
      <div class="card-icon" [style.background]="card.cor + '15'" [style.color]="card.cor">
        <i [class]="card.icone"></i>
      </div>
      <div class="card-body">
        <h3>{{ card.titulo }}</h3>
        <p>{{ card.descricao }}</p>
      </div>
      <div class="card-footer">
        <span class="card-tag" [style.background]="card.cor + '15'" [style.color]="card.cor">
          <i class="fas" [class.fa-chart-bar]="card.tipo === 'grafico'" [class.fa-table]="card.tipo === 'tabela'" [class.fa-download]="card.tipo === 'exportar'"></i>
          {{ card.tipo === 'grafico' ? 'Gráfico' : card.tipo === 'tabela' ? 'Tabela' : 'Exportar' }}
        </span>
        <button class="btn-gerar">Visualizar</button>
      </div>
    </div>
  </div>
</div>
