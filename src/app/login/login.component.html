<div class="login-container">
  <img src="assets/logo-capsi.png" alt="Logo CAPS" class="logo">

  <h2>Bem-vindo ao CAPS Garanhuns</h2>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div>
      <label for="email">Usuário E-mail</label>
      <input
        type="text"
        id="email"
        required
        [(ngModel)]="loginData.email"
        name="email"
        placeholder="Digite seu usuário"
      />
    </div>

    <div>
      <label for="password">Senha</label>
      <input
        type="password"
        id="password"
        required
        [(ngModel)]="loginData.password"
        name="password"
        placeholder="Digite sua senha"
      />
    </div>

    <button type="submit" [disabled]="!loginForm.form.valid">Entrar</button>
  </form>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>
</div>
