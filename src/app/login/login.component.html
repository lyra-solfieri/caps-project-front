<div class="login-container">
  <img src="logo-caps-original.png" alt="Logo CAP" class="logo" />

  <h2>Bem-vindo ao CAPS Garanhuns</h2>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div>
      <label for="email">Usuário E-mail</label>
      <input
        type="email"
        id="email"
        required
        email
        #emailField="ngModel"
        [(ngModel)]="loginData.email"
        name="email"
        placeholder="Digite seu e-mail"
        data-cy="input-email"
      />
      <div *ngIf="emailField.invalid && emailField.touched" class="field-error">
        Informe um e-mail válido
      </div>
    </div>

    <div>
      <label for="password">Senha</label>
      <input
        type="password"
        id="password"
        required
        [(ngModel)]="loginData.password"
        name="password"
        placeholder="Digite sua senha"
        data-cy="input-password"
      />
    </div>

    <button type="submit" [disabled]="!loginForm.form.valid">Entrar</button>
  </form>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>
</div>
