<div class="perfil-page">
  <div class="perfil-card">
    <div class="perfil-header">
      <span class="perfil-avatar">👤</span>
      <h2>Meu Perfil</h2>
    </div>

    <div *ngIf="!editando" class="perfil-info">
      <div class="info-row">
        <span class="info-label">E-mail</span>
        <span class="info-value">{{ user?.email }}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Nome</span>
        <span class="info-value">{{ user?.nome || '-' }}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Nível de Acesso</span>
        <span class="info-value role">{{ user?.role }}</span>
      </div>

      <button class="btn-editar" (click)="alternarEdicao()">Editar Dados</button>

      <button *ngIf="isAdmin" class="btn-admin" routerLink="/register">Gerenciar Equipe</button>
    </div>

    <div *ngIf="editando" class="perfil-form">
      <form [formGroup]="editForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" type="email" formControlName="email">
        </div>
        <div class="form-group">
          <label for="nome">Nome</label>
          <input id="nome" type="text" formControlName="nome" placeholder="Seu nome">
        </div>

        <div class="form-actions">
          <button class="btn-salvar" (click)="salvar()" [disabled]="editForm.pristine">Salvar</button>
          <button class="btn-cancelar" (click)="alternarEdicao()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
