<app-header></app-header>
<div class="cadastro-container">
  <h2>Cadastro de Paciente</h2>
  <p class="required-legend">Os campos marcados com <span class="required">*</span> são obrigatórios.</p>

  <form #pacienteForm="ngForm" (ngSubmit)="onSubmit()">
    
    <div class="form-section">
      <h3>Informações Pessoais</h3>
      
      <div class="form-group">
        <label for="nome">Nome Completo <span class="required">*</span></label>
        <input type="text" id="nome" name="nome" required [(ngModel)]="paciente.nome" />
      </div>

      <div class="form-group">
        <label for="cpf">CPF <span class="required">*</span></label>
        <input type="text" id="cpf" name="cpf" required [(ngModel)]="paciente.cpf" />
      </div>

      <div class="form-group">
        <label for="dataNascimento">Data de Nascimento <span class="required">*</span></label>
        <input type="date" id="dataNascimento" name="dataNascimento" required [(ngModel)]="paciente.dataNascimento" />
      </div>

      <div class="form-group">
        <label for="genero">Gênero <span class="required">*</span></label>
        <select id="genero" name="genero" required [(ngModel)]="paciente.genero">
          <option [ngValue]="null">Selecione</option>
          <option *ngFor="let g of generos" [ngValue]="g">{{ g }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="raca">Raça</label>
        <select id="raca" name="raca" [(ngModel)]="paciente.raca">
          <option [ngValue]="null">Selecione</option>
          <option *ngFor="let r of racas" [ngValue]="r">{{ r }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="profissao">Profissão</label>
        <input type="text" id="profissao" name="profissao" [(ngModel)]="paciente.profissao" />
      </div>
    </div>

    <div class="form-section">
      <h3>Contato</h3>

      <div class="form-group">
        <label for="telefone">Telefone <span class="required">*</span></label>
        <input type="text" id="telefone" name="telefone" required [(ngModel)]="paciente.telefone" />
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" [(ngModel)]="paciente.email" />
      </div>
    </div>
    
    <div class="form-section">
      <h3>Filiação</h3>

      <div class="form-group">
        <label for="nomeMae">Nome da Mãe <span class="required">*</span></label>
        <input type="text" id="nomeMae" name="nomeMae" required [(ngModel)]="paciente.nomeMae" />
      </div>

      <div class="form-group">
        <label for="nomePai">Nome do Pai</label>
        <input type="text" id="nomePai" name="nomePai" [(ngModel)]="paciente.nomePai" />
      </div>
    </div>

    <div class="form-section">
      <h3>Saúde e Prontuário</h3>

      <div class="form-group">
        <label for="numeroCartaoSUS">Cartão SUS</label>
        <input type="text" id="numeroCartaoSUS" name="numeroCartaoSUS" [(ngModel)]="paciente.numeroCartaoSUS" />
      </div>

      <div class="form-group">
        <label for="numeroProntuario">Número do Prontuário</label>
        <input type="number" id="numeroProntuario" name="numeroProntuario" [(ngModel)]="paciente.numeroProntuario" />
      </div>
    </div>

    <div class="form-section">
      <h3>Endereço</h3>
      
      <div class="form-group">
        <label for="cep">CEP <span class="required">*</span></label>
        <input type="text" id="cep" name="cep" required placeholder="00000-000">
      </div>
      
      <div class="form-group">
        <label for="rua">Rua <span class="required">*</span></label>
        <input type="text" id="rua" name="rua" required placeholder="">
      </div>

      <div class="form-group">
        <label for="numero">Número <span class="required">*</span></label>
        <input type="text" id="numero" name="numero" required placeholder="">
      </div>
      
      <div class="form-group">
        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento" placeholder="">
      </div>

      <div class="form-group">
        <label for="bairro">Bairro <span class="required">*</span></label>
        <input type="text" id="bairro" name="bairro" required placeholder="">
      </div>

      <div class="form-group">
        <label for="cidade">Cidade <span class="required">*</span></label>
        <input type="text" id="cidade" name="cidade" required placeholder="">
      </div>

      <div class="form-group">
        <label for="estado">Estado <span class="required">*</span></label>
        <input type="text" id="estado" name="estado" required placeholder="">
      </div>
      
    </div>

    <div class="form-section">
      <h3>Outras Informações</h3>

      <div class="form-group">
        <label>
          <input type="checkbox" name="infantojuvenil" [(ngModel)]="paciente.infantojuvenil" />
          Infantojuvenil
        </label>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" name="emSituacaoSocioeconomica" [(ngModel)]="paciente.emSituacaoSocioeconomica" />
          Em situação socioeconômica vulnerável
        </label>
      </div>
    </div>

    <div class="buttons">
      <button type="submit" [disabled]="!pacienteForm.form.valid">Salvar</button>
      <button type="button" class="cancel" (click)="cancelar()">Cancelar</button>
    </div>

  </form>
</div>
