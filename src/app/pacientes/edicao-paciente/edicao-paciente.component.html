<div class="cadastro-container">
    <h2>Edição de Paciente</h2>
  
    <form #pacienteForm="ngForm" (ngSubmit)="onSubmit()">
      <!-- Nome -->
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          required
          [(ngModel)]="paciente.nome"
          placeholder="Digite o nome completo"
        />
      </div>
  
      <!-- Idade -->
      <div class="form-group">
        <label for="idade">Idade</label>
        <input
          type="number"
          id="idade"
          name="idade"
          required
          [(ngModel)]="paciente.idade"
          placeholder="Digite a idade"
        />
      </div>
  
      <!-- Responsável -->
      <div class="form-group">
        <label for="responsavel">Nome do Responsável</label>
        <input
          type="text"
          id="responsavel"
          name="responsavel"
          required
          [(ngModel)]="paciente.responsavel"
          placeholder="Digite o nome do responsável"
        />
      </div>
  
      <!-- Observações -->
      <div class="form-group">
        <label for="observacoes">Observações</label>
        <textarea
          id="observacoes"
          name="observacoes"
          [(ngModel)]="paciente.observacoes"
          placeholder="Digite alguma observação"
        ></textarea>
      </div>
  
      <!-- Botões -->
      <div class="buttons">
        <button type="submit" [disabled]="!pacienteForm.form.valid">
          Atualizar
        </button>
        <button type="button" class="cancel" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
