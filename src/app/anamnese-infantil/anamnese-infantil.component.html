
<div class="pacientes-container">

  <div class="pacientes-header">
    <h2>Anamneses</h2>

    <div class="pacientes-actions">
      <button class="back-button" (click)="voltar()">Voltar</button>
      <button class="add-button" (click)="addAnamnese()">+ Nova Anamnese</button>
    </div>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Carregando anamneses...</p>
  </div>

  <table *ngIf="!loading && anamnese.length > 0" class="pacientes-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Paciente</th>
        <th>Profissional</th>
        <th>Data</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let a of anamnese">
        <td>{{ a.id }}</td>
        <td>{{ a.pacienteId }}</td>
        <td>{{ a.profissionalResponsavel }}</td>
        <td>{{ a.dataRegistro | date:'short' }}</td>

        <td>
          <button class="edit" (click)="editar(a.id!)">Editar</button>
          <button class="delete" (click)="deletar(a.id!)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && anamnese.length === 0" class="empty-message">
    Nenhuma anamnese encontrada.
  </div>

  <div class="paginacao" *ngIf="!loading && anamnese.length > 0">
    <button (click)="paginaAnterior()" [disabled]="pageNo === 0">Anterior</button>
    <button (click)="proximaPagina()" [disabled]="(pageNo + 1) * pageSize >= totalElements">
      Próxima
    </button>
  </div>

  <app-selecionar-paciente-modal
    *ngIf="mostrarModal"
    (fechado)="fecharModal()"
    (selecionado)="onPacienteSelecionado($event)">
  </app-selecionar-paciente-modal>

</div>
