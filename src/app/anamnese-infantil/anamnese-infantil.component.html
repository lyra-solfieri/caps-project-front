
<div class="anamnese-container">
  <div class="anamnese-header">
    <h2>Anamneses</h2>
    <span class="total-badge">{{ totalElements }} registro{{ totalElements !== 1 ? 's' : '' }}</span>
    <div class="anamnese-actions">
      <button class="back-button" (click)="voltar()">
        Voltar ao Menu
      </button>
      <button class="add-button" (click)="addAnamnese()">
        + Nova Anamnese
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Carregando anamneses...</p>
  </div>

  <div class="table-responsive" *ngIf="!loading && anamnese.length > 0">
    <table class="anamnese-table">
      <thead>
        <tr>
          <th>Paciente</th>
          <th>Profissional</th>
          <th>Data</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let a of anamnese">
          <td>{{ nomesPacientes[a.pacienteId] || 'Carregando...' }}</td>
          <td>{{ a.profissionalResponsavel }}</td>
          <td>{{ a.dataRegistro | date:'short' }}</td>

          <td class="acoes">
            <button
              class="icon-btn edit"
              (click)="editar(a.id!)"
              data-tooltip="Editar">
              ✏️
            </button>

            <button
              class="icon-btn delete"
              (click)="deletar(a.id!)"
              data-tooltip="Excluir">
              🗑️
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && anamnese.length === 0" class="empty-message">
    Nenhuma anamnese encontrada.
  </div>

  <div class="paginacao" *ngIf="totalPages > 1">
    <button
      (click)="paginaAnterior()"
      [disabled]="isFirst">
      ⬅ Anterior
    </button>

    <button
      *ngFor="let p of [].constructor(totalPages); let i = index"
      (click)="irParaPagina(i)"
      [class.ativo]="i === pageNo">
      {{ i + 1 }}
    </button>

    <button
      (click)="proximaPagina()"
      [disabled]="isLast">
      Próxima ➡
    </button>
  </div>

  <app-selecionar-paciente-modal
    *ngIf="mostrarModal"
    (fechado)="fecharModal()"
    (selecionado)="onPacienteSelecionado($event)">
  </app-selecionar-paciente-modal>

</div>
