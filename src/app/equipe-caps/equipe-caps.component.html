<div class="equipe-page">
  <div class="equipe-header">
    <h2>Equipe CAPS</h2>
    <div class="equipe-actions">
      <button class="btn-add" routerLink="/dashboard">Voltar ao Menu</button>
      <button *ngIf="isAdmin" class="btn-add" (click)="alternarFormulario()">
        {{ exibirFormulario ? '✕ Fechar' : '+ Novo Usuário' }}
      </button>
    </div>
  </div>

  <div *ngIf="exibirFormulario" class="register-card">
    <div class="card-header">
      <h3>Cadastrar Novo Usuário</h3>
    </div>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="email@exemplo.com" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" placeholder="Mín. 8 caracteres, maiúscula, minúscula, número, especial">
      </div>
      <div class="form-group">
        <label for="nome">Nome</label>
        <input id="nome" type="text" formControlName="nome" placeholder="Nome completo">
      </div>
      <div class="form-group">
        <label for="profissao">Profissão</label>
        <input id="profissao" type="text" formControlName="profissao" placeholder="Ex: Psicólogo">
      </div>
      <div class="form-group">
        <label for="role">Nível de Acesso</label>
        <select id="role" formControlName="role">
          <option value="USER">Usuário</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>
      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid">Cadastrar</button>
    </form>
  </div>

  <div  class="equipe-list">
    <div *ngIf="loading" class="loading">Carregando...</div>

    <div *ngIf="!loading && usuarios.length === 0" class="empty">
      Nenhum usuário encontrado.
    </div>

    <table *ngIf="!loading && usuarios.length > 0" class="usuarios-table">
      <thead>
        <tr>
          <th>E-mail</th>
          <th>Nome</th>
          <th>Nível de Acesso</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of usuarios">
          <td>{{ user.email }}</td>
          <td>{{ user.nome || '-' }}</td>
          <td><span class="role-badge" [class.admin]="user.role === 'ADMIN'" [class.user]="user.role === 'USER'">{{ user.role }}</span></td>          <td>{{ user.ativo !== false ? 'Ativo' : 'Inativo' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
